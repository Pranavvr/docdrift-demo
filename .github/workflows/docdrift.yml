name: DocDrift

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  docdrift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff the PR against its base
      - uses: Pranavvr/docdrift@main
